<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail předmětu</title>
    <link href="css/styles.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="subject-detail-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center overflow-y-auto">
        <div class="bg-white p-8 rounded-lg max-w-4xl w-full max-h-full overflow-y-auto relative">
            <h2 class="text-sky-700 font-bold text-2xl mb-4">Detail předmětu</h2>
            <button id="close-modal-btn" class="absolute top-8 right-8 p-2 rounded-full bg-gray-200 hover:bg-gray-300 focus:outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            <div class="overflow-x-auto py-4">
                <table class="text-gray-800/90 w-full md:w-auto">
                    <thead>
                        <tr class="p-4 border-t border-b">
                            <th class="text-left w-1/5">Zkratka</th>
                            <th class="text-left w-2/5">Název</th>
                            <th class="text-center w-1/5">Kredity</th>
                            <th class="text-center w-1/5 whitespace-pre-line">Rozsah výuky 
                                Př+Cv+Sem</th>
                            <th class="text-center w-1/5">Zakončení</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="border-b">
                            <td class="text-left py-3" id="zkratka"></td>
                            <td class="text-left py-3" id="nazev"></td>
                            <td class="text-center py-3" id="kredity"></td>
                            <td class="text-center py-3" id="rozsah"></td>
                            <td class="text-center py-3" id="zakonceni"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <section>
                <article class="pt-2 pb-6">
                    <h3 class="text-gray-800/90 font-bold">Anotace kurzu: </h3>
                    <p id="anotace"></p>
                </article>
                <article>
                    <h3 class="text-gray-800/90 font-bold">Rámcový obsah kurzu: </h3>
                    <p id="obsah"></p>
                </article>
            </section>

            <button id="close-modal-btn-bottom" class="mt-4 bg-sky-700 text-white px-4 py-2 rounded-md">Zavřít</button>
        </div>
    </div>

    <script src="js/display_subject_detail.js"></script>
</body>

</html>
