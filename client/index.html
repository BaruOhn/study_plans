<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studijní plány</title>
    <link href="css/styles.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/94bfb75d9d.js" crossorigin="anonymous"></script>
</head>

<body class="bg-bg-gray-light">
    <div style="background-image: linear-gradient(rgba(3, 105, 161, 0.9), rgba(14, 165, 233, 0.8)), url('assets/image.png'); background-size: cover; background-position: center;">
        <header class="px-4 py-6 md:px-8 md:py-8">
            <div class="flex justify-between items-center">
                <a href="index.html"><img src="assets/logo.png" alt="Studijní plány" class="logo" width="260" height="130"></a>
                <button class="text-white border-white border rounded-full px-4 py-2 hidden md:block"><a href="login.html"><i class="fas fa-user text-white mr-2"></i>Přihlásit se</a></button>
                <button class="border border-white rounded-full px-4 py-2 md:hidden"><a href="login.html"><i class="fas fa-user text-white text-xl"></i></a></button>
            </div>
        </header>
        
        <!-- Sekce pro vyhledávání -->
        <section>
            <h2 class="text-white font-semibold text-center text-4xl md:text-5xl lg:text-6xl px-4 pt-16 pb-6 md:px-8 md:pt-20 md:pb-8 lg:pt-28 lg:pb-8">Přehled nabídky studia</h2>
            <div class="flex justify-center pb-12 px-4 lg:pb-20 sm:px-0">
                <form id="search-form" class="w-full max-w-sm sm:max-w-md md:max-w-lg lg:max-w-xl xl:max-w-2xl relative">
                    <input id="search-input" type="search" name="search" placeholder="Vyhledat studijní program..." class="w-full rounded-full focus:outline-none px-6 py-4 pl-6 mb-4 sm:mb-0 sm:mr-4">
                    <i id="search-icon" class="fas fa-search bg-amber-500 rounded-full px-3 py-2 text-2xl text-white absolute top-0 right-0 mt-2 mr-2 cursor-pointer"></i>
                </form>                
            </div>
        </section>

       <!-- Sekce pro filtrování studijních programů -->
        <section id="menu" class="flex flex-wrap space-x-5 justify-center pb-16 w-full md:max-w-4xl lg:max-w-6xl xl:max-w-7xl mx-auto">
            <!-- Skupina filtrů podle typu studijního programu -->
            <div class="space-x-1 flex flex-wrap justify-center">
                <button class="filter-btn bg-white rounded-full focus:bg-amber-500 font-bold text-sky-700 focus:text-white px-3 py-2 md:px-4 md:py-3 mb-2" data-filter="all">Vše</button>
                <button class="filter-btn bg-white rounded-full focus:bg-amber-500 font-bold text-sky-700 focus:text-white px-3 py-2 md:px-4 md:py-3 mb-2" data-filter="bakalarske">Bakalářské</button>
                <button class="filter-btn bg-white rounded-full focus:bg-amber-500 font-bold text-sky-700 focus:text-white px-3 py-2 md:px-4 md:py-3 mb-2" data-filter="navazujici">Navazující</button>
                <button class="filter-btn bg-white rounded-full focus:bg-amber-500 font-bold text-sky-700 focus:text-white px-3 py-2 md:px-4 md:py-3 mb-2" data-filter="doktorske">Doktorské</button>
            </div>
            <!-- Skupina filtrů podle formy studia -->
            <div class="space-x-1 flex flex-wrap justify-center">
                <button class="filter-btn bg-white rounded-full focus:bg-amber-500 font-bold text-sky-700 focus:text-white px-3 py-2 md:px-4 md:py-3 mb-2" data-filter="prezencni">Prezenční</button>
                <button class="filter-btn bg-white rounded-full focus:bg-amber-500 font-bold text-sky-700 focus:text-white px-3 py-2 md:px-4 md:py-3 mb-2" data-filter="kombinovane">Kombinované</button>
            </div>
            <!-- Skupina filtrů podle jazyka výuky -->
            <div class="space-x-1 flex flex-wrap justify-center">
                <button class="filter-btn bg-white rounded-full focus:bg-amber-500 font-bold text-sky-700 focus:text-white px-3 py-2 md:px-4 md:py-3 mb-2" data-filter="cestina">Čeština</button>
                <button class="filter-btn bg-white rounded-full focus:bg-amber-500 font-bold text-sky-700 focus:text-white px-3 py-2 md:px-4 md:py-3 mb-2" data-filter="anglictina">Angličtina</button>
            </div>
        </section>
    </div>

    <!-- Sekce pro zobrazení studijních programů -->
    <section id="study-programs" class="w-full md:max-w-4xl lg:max-w-6xl xl:max-w-7xl mx-auto mt-8 px-4">
    </section>
    
</body>
<script src="js/display_programs.js"></script>

</html>
