<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studijní plán</title>
    <link href="css/styles.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/94bfb75d9d.js" crossorigin="anonymous"></script>
</head>

<body class="font-sans">
    <header class="bg-sky-700 px-7 md:px-8 print:hidden">
        <div class="flex justify-between items-center">
            <a href="index.html"><img src="assets/logo.png" alt="Studijní plány" class="logo" width="260" height="130"></a>
            <button class="text-white border-white border rounded-full px-4 py-2 hidden md:block"><a href="login.html"><i class="fas fa-user mr-2"></i>Přihlásit se</a></button>
            <button class="border border-white rounded-full px-4 py-2 md:hidden"><a href="login.html"><i class="fas fa-user text-white text-xl"></i></a></button>
        </div>
    </header>
    <section class="mx-6 sm:mx-9 print:mx-6">
        <div class="flex flex-wrap justify-between">
            <div>
                <h2 class="text-sky-700 font-bold text-2xl mt-7 program-name print:text-xl"></h2>
                <span class="text-gray-500 program-type print:text-sm"></span>
            </div>
            <button id="download-pdf" class="text-gray-700 print:hidden mt-7"><i class="bg-bg-gray-light px-3 py-2 rounded-xl fas fa-file text-gray-700 mr-2"></i>Stáhnout PDF</button>
        </div>
        <h3 class="text-gray-700 font-bold text-xl mt-7 program-form print:text-base"></h3>
    </section>
    <main class="mx-4">
        <div id="content" class="flex flex-wrap justify-center w-full"></div>
    </main>

    <footer class="text-center text-gray-400 px-7 pt-0 pb-8">
        <p id="last-update">Poslední aktualizace dat: </p>
    </footer>

    <script src="js/display_study_plan.js"></script>
    <script src="js/last_data_update.js"></script>
</body>

</html>
