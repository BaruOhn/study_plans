<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studijní plány</title>
    <link href="css/styles.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/94bfb75d9d.js" crossorigin="anonymous"></script>
</head>

<body class="bg-bg-gray-light">
    <header class="bg-sky-700 px-7 py-4 md:px-8">
        <div class="flex justify-between items-center">
            <a href="index.html"><img src="assets/logo.png" alt="Studijní plány" class="logo" width="260" height="130"></a>
            <div class="flex items-center gap-4">
                <button class="text-white border-white border rounded-full px-4 py-2 hidden md:flex items-center"><a href="about_app.html" class="flex items-center"><i class="fas fa-info-circle text-white mr-2"></i>O aplikaci</a></button>
                <button class="border border-white rounded-full px-4 py-2 md:hidden"><a href="about_app.html"><i class="fas fa-info-circle text-white text-xl"></i></a></button>
            </div>
        </div>
    </header>

    <main class="flex justify-center items-center">
        <section>
            <h2 class="text-sky-700 font-bold text-4xl text-center mt-16 mb-8">Přihlásit se</h2>
            <article class="bg-white p-8 rounded-2xl">
                <form action="index.html" method="post" class="flex flex-col">
                    <label for="email" class="text-gray-700 mb-2">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="jan.novak@upol.cz" class="bg-bg-gray-light text-left w-60 sm:w-96 rounded-2xl px-5 py-3 mb-4 focus:outline-gray-400">
                    <label for="password" class="text-gray-700 mb-2">Heslo</label>
                    <input type="password" id="password" name="password" placeholder="Zadejte heslo.." class="bg-bg-gray-light text-left w-full rounded-2xl px-5 py-3 mb-4 focus:outline-gray-400">
                    <button type="submit" class="bg-sky-700 text-white font-bold rounded-full px-5 py-3 mt-8 hover:bg-sky-800">Přihlásit se<i class="fas fa-arrow-right ml-2"></i></button>
                </form>
            </article>
        </section>
    </main>

    <script src="js/login.js"></script>
</body>

</html>
